name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        provider: [cursor, slack]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          cache-dependency-path: providers/${{ matrix.provider }}/go.sum
      - name: Test ${{ matrix.provider }} provider
        working-directory: providers/${{ matrix.provider }}
        run: go test ./...
